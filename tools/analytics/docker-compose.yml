# Swift Analytics — Apache Superset, local, themed Swift, reading Swift's DB.
#   cd tools/analytics && docker compose up -d
# Then open http://localhost:8088
#
# [REPORT-033 S1] The port is bound to LOOPBACK ONLY. It used to be "8088:8088",
# which publishes on every host interface — so on shared wifi (a cafe, a hotel,
# a co-working LAN) anyone on the network could reach a Superset admin console
# whose password is in this file, pointed at a read-only replica of Swift's
# database. Local-only is what the README always claimed; now it is enforced by
# the binding rather than by good intentions.
#
# The admin password and signing key are overridable: export SUPERSET_ADMIN_PASSWORD
# and SUPERSET_SECRET_KEY before `docker compose up` and neither default is used.
# Reads Swift's Postgres through the READ-ONLY superset_ro user (host.docker.internal:5434).
services:
  swift-superset:
    build: .                      # apache/superset:4.1.1 + psycopg2 (Postgres driver)
    image: swift-superset:local
    container_name: swift-superset
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      # Local-only signing key. Override for anything non-local.
      SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY:-swift-analytics-local-dev-only-not-a-real-secret-change-me}"
      SUPERSET_ADMIN_PASSWORD: "${SUPERSET_ADMIN_PASSWORD:-admin}"
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
      SUPERSET_LOAD_EXAMPLES: "no"
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py:ro
      - swift_superset_home:/app/superset_home
    # First boot: migrate metadata, create the admin, init roles, then serve.
    command:
      - /bin/bash
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin --username admin --firstname Swift --lastname Admin --email admin@swift.gy --password "$${SUPERSET_ADMIN_PASSWORD}" || true &&
        superset init &&
        /usr/bin/run-server.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  swift_superset_home:
