name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      - run: pnpm lint
      - run: pnpm type-check
      - name: Mobile unit tests
        run: pnpm --filter @swift/mobile test

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: swift
          POSTGRES_PASSWORD: swift
          POSTGRES_DB: swift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U swift"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      - name: Run database migrations
        run: cd apps/api && npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
      - name: Seed database
        run: cd apps/api && npx prisma db seed
        env:
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
          REDIS_URL: redis://localhost:6379
      - name: Run tests
        run: pnpm --filter @swift/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-not-for-production
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-for-production

      # Step 15: an untested backup does not exist. Dump the post-suite
      # database and prove it restores into a scratch DB with sane contents.
      - name: Backup the database (pg_dump)
        run: pg_dump "postgresql://swift:swift@localhost:5432/swift_test" -Fc -f /tmp/swift-ci.dump
      - name: Restore into a scratch DB and sanity-check
        env:
          PGPASSWORD: swift
        run: |
          createdb -h localhost -U swift swift_restore_check
          pg_restore --no-owner -h localhost -U swift -d swift_restore_check /tmp/swift-ci.dump
          USERS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM users;')
          CONFIGS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM country_configs;')
          VENDORS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM vendors;')
          echo "restored: users=$USERS country_configs=$CONFIGS vendors=$VENDORS"
          test "$USERS" -ge 4
          test "$CONFIGS" -ge 1
          test "$VENDORS" -ge 4

  api-build:
    name: API Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      - run: pnpm --filter @swift/api build

  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swift/admin build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high || true
      - name: Check for known vulnerabilities
        run: npx audit-ci --high
        continue-on-error: true
