name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A repo nobody pushes to for two weeks can still rot — a registry retires an
  # endpoint (it retired pnpm audit's), an action deprecates, a cert expires.
  # Monday's run makes decay visible the week it happens, not the day it blocks
  # an urgent fix. workflow_dispatch = a manual "prove it still builds" button.
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI consumes no secrets and needs nothing from the repo-scoped GITHUB_TOKEN
# beyond checkout. Explicit read-only is defense-in-depth on a public repo
# (the repo default is already read-only).
permissions:
  contents: read

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # corepack-managed pnpm (from the packageManager field). The
      # pnpm/action-setup standalone wrapper hits a deterministic linker
      # ENOENT on this workspace (see pnpm/pnpm#9249 + the probe runs:
      # apps/api exists before AND after, yet its node_modules mkdir
      # 'fails') — the identical install passes with corepack pnpm on
      # macOS and Linux-docker. No pnpm caches existed, so `cache: pnpm`
      # is dropped with nothing lost.
      - run: corepack enable && corepack prepare --activate
      # The retry is a cheap belt for transient registry/link hiccups. (The
      # 10-day deterministic install failure here was a COMMITTED
      # apps/api/node_modules symlink — dangling on a fresh checkout, and
      # node's recursive mkdir reports a dangling-symlink target as the
      # misleading ENOENT. Fixed by de-indexing it; the .gitignore pattern
      # is now 'node_modules' without the slash so a symlink can never
      # sneak back in.)
      - run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      - run: pnpm lint
      - run: pnpm type-check
      - name: Mobile unit tests
        run: pnpm --filter @swift/mobile test

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: swift
          POSTGRES_PASSWORD: swift
          POSTGRES_DB: swift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U swift"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # corepack-managed pnpm (from the packageManager field). The
      # pnpm/action-setup standalone wrapper hits a deterministic linker
      # ENOENT on this workspace (see pnpm/pnpm#9249 + the probe runs:
      # apps/api exists before AND after, yet its node_modules mkdir
      # 'fails') — the identical install passes with corepack pnpm on
      # macOS and Linux-docker. No pnpm caches existed, so `cache: pnpm`
      # is dropped with nothing lost.
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      # A step named "Run database migrations" that ran `db push` instead was
      # how this survived unnoticed. `db push` reconciles the SCHEMA SHAPE and
      # executes no migration SQL, so the api-test database carried 9 of 13
      # triggers and 14 of 29 CHECK constraints — every money-integrity check,
      # the double-entry balance trigger, consent immutability and the safety
      # evidence chain of custody were all absent. The whole suite has been
      # grading itself against a permissive schema.
      #
      # It now replays the real migrations. Measured on both, 29 Aug 2026:
      # migrated = 13 triggers / 29 CHECKs / 54 RLS policies.
      - name: Replay migrations (the real production schema)
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
      - name: Seed database
        run: cd apps/api && npx prisma db seed
        env:
          NODE_ENV: test
          SEED_DEMO_CONFIRM: "YES"
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
          REDIS_URL: redis://localhost:6379
      - name: Run tests
        run: pnpm --filter @swift/api test -- --coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-not-for-production
      # SWIFT-165: publish the coverage number to the run summary. Measured, not
      # gated — no thresholds yet (ratchet later once the baseline is watched).
      - name: Publish coverage to the run summary
        if: always()
        run: |
          test -f apps/api/coverage/coverage-summary.json || exit 0
          echo "### API test coverage" >> "$GITHUB_STEP_SUMMARY"
          node -e "const t=require('./apps/api/coverage/coverage-summary.json').total; for (const k of ['lines','statements','branches','functions']) console.log('- **'+k+'**: '+t[k].pct+'% ('+t[k].covered+'/'+t[k].total+')');" >> "$GITHUB_STEP_SUMMARY"

      # Step 15: an untested backup does not exist. Dump the post-suite
      # database and prove it restores into a scratch DB with sane contents.
      - name: Backup the database (pg_dump)
        run: pg_dump "postgresql://swift:swift@localhost:5432/swift_test" -Fc -f /tmp/swift-ci.dump
      - name: Restore into a scratch DB and sanity-check
        env:
          PGPASSWORD: swift
        run: |
          createdb -h localhost -U swift swift_restore_check
          pg_restore --no-owner -h localhost -U swift -d swift_restore_check /tmp/swift-ci.dump
          USERS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM users;')
          CONFIGS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM country_configs;')
          VENDORS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM vendors;')
          echo "restored: users=$USERS country_configs=$CONFIGS vendors=$VENDORS"
          test "$USERS" -ge 4
          test "$CONFIGS" -ge 1
          test "$VENDORS" -ge 4

  api-build:
    name: API Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # corepack-managed pnpm (from the packageManager field). The
      # pnpm/action-setup standalone wrapper hits a deterministic linker
      # ENOENT on this workspace (see pnpm/pnpm#9249 + the probe runs:
      # apps/api exists before AND after, yet its node_modules mkdir
      # 'fails') — the identical install passes with corepack pnpm on
      # macOS and Linux-docker. No pnpm caches existed, so `cache: pnpm`
      # is dropped with nothing lost.
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      - run: pnpm --filter @swift/api build

  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # corepack-managed pnpm (from the packageManager field). The
      # pnpm/action-setup standalone wrapper hits a deterministic linker
      # ENOENT on this workspace (see pnpm/pnpm#9249 + the probe runs:
      # apps/api exists before AND after, yet its node_modules mkdir
      # 'fails') — the identical install passes with corepack pnpm on
      # macOS and Linux-docker. No pnpm caches existed, so `cache: pnpm`
      # is dropped with nothing lost.
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      # [TA-S0-006] Arm every server-only secret with a canary BEFORE the build,
      # so the artifact scan after it can prove no server secret was inlined.
      - name: Arm the secret canaries
        run: node scripts/secret-canary.js --emit >> "$GITHUB_ENV"
      - run: pnpm --filter @swift/admin build
      # [GRD-1 §2 / WS-15] NEXT_PUBLIC_* is inlined at build time, so the built
      # bundle is where a mis-prefixed secret actually becomes public. Scanning
      # the artefact catches what a source grep cannot — a dependency or a
      # generated file introducing one.
      # [SCR-006] What the build IS: its manifest (every file's digest, the entrypoints, the commit), so the gate
      # certifies THIS artifact and writes a receipt for it; both stay with the run as the scan attestation.
      - name: Artifact manifest (admin)
        run: node scripts/artifact-manifest.js apps/admin/.next --app admin --commit ${{ github.sha }} --entry BUILD_ID --out artifact-admin.manifest.json
      - name: No unlisted public variable reached the built admin bundle
        run: node scripts/public-secrets-gate.js --bundle apps/admin/.next --manifest artifact-admin.manifest.json --app admin --commit ${{ github.sha }} --receipt artifact-admin.receipt.json
      - name: Keep the admin manifest and scan receipt with the run
        uses: actions/upload-artifact@v7
        with:
          name: artifact-admin-attestation
          path: |
            artifact-admin.manifest.json
            artifact-admin.receipt.json
          if-no-files-found: error
      # [TA-S0-006] The name gate above reasons about identifiers; a bundler
      # inlines VALUES and drops the names. These two certify the artifact:
      # no armed canary anywhere in the build output (server chunks and
      # prerendered pages included), and no secret-shaped value in what a
      # browser actually downloads.
      - name: No server secret reached the built admin artifacts
        run: node scripts/secret-canary.js --scan apps/admin/.next
      - name: No secret-shaped value in what the admin ships to browsers
        run: bash scripts/fetch-gitleaks.sh && ./gitleaks detect --no-git --source apps/admin/.next/static --redact --exit-code 1

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # corepack-managed pnpm (from the packageManager field). The
      # pnpm/action-setup standalone wrapper hits a deterministic linker
      # ENOENT on this workspace (see pnpm/pnpm#9249 + the probe runs:
      # apps/api exists before AND after, yet its node_modules mkdir
      # 'fails') — the identical install passes with corepack pnpm on
      # macOS and Linux-docker. No pnpm caches existed, so `cache: pnpm`
      # is dropped with nothing lost.
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      # [SITE-1.1] The public site serves a build-time snapshot of the DGP-1
      # legal text so /legal/* survives an API outage. This fails if the snapshot
      # has drifted from the source, which would mean the site and the app were
      # showing users different words.
      - name: Legal snapshot is in sync
        run: pnpm --filter @swift/web legal:sync -- --check

      # CI proves the site COMPILES; it must stay green while the founder's
      # company details are legitimately still unfilled. The real gate — refusing
      # to ship a site that says "{{LEGAL_ENTITY_NAME}}" to a reviewer — lives in
      # the build itself and in deploy-web.yml. [SITE-1.1 Part 3 / AC-9]
      # [TA-S0-006] Arm every server-only secret with a canary BEFORE the build,
      # so the artifact scan after it can prove no server secret was inlined.
      - name: Arm the secret canaries
        run: node scripts/secret-canary.js --emit >> "$GITHUB_ENV"
      # [SWX-DEV-WEB-076 · integrated] A production web build REQUIRES the one
      # canonical release origin (src/lib/browser-api-origin.ts) and refuses
      # anything else, so CI hands it exactly that and the law is exercised on
      # every PR. The real deploy runs on Vercel, whose project environment
      # carries the same value.
      - run: pnpm --filter @swift/web build
        env:
          NEXT_PUBLIC_ALLOW_SITE_TOKENS: '1'
          NEXT_PUBLIC_API_URL: https://api.swiftgy.com
      # [GRD-1 §2 / WS-15] See the admin job: the inlining happens at build
      # time, so the artefact is the only place the leak is real.
      # [SCR-006] What the build IS: its manifest (every file's digest, the entrypoints, the commit), so the gate
      # certifies THIS artifact and writes a receipt for it; both stay with the run as the scan attestation.
      - name: Artifact manifest (web)
        run: node scripts/artifact-manifest.js apps/web/.next --app web --commit ${{ github.sha }} --entry BUILD_ID --out artifact-web.manifest.json
      - name: No unlisted public variable reached the built web bundle
        run: node scripts/public-secrets-gate.js --bundle apps/web/.next --manifest artifact-web.manifest.json --app web --commit ${{ github.sha }} --receipt artifact-web.receipt.json
      - name: Keep the web manifest and scan receipt with the run
        uses: actions/upload-artifact@v7
        with:
          name: artifact-web-attestation
          path: |
            artifact-web.manifest.json
            artifact-web.receipt.json
          if-no-files-found: error
      - name: No server secret reached the built web artifacts
        run: node scripts/secret-canary.js --scan apps/web/.next
      - name: No secret-shaped value in what the site ships to browsers
        run: bash scripts/fetch-gitleaks.sh && ./gitleaks detect --no-git --source apps/web/.next/static --redact --exit-code 1

  desktop-build:
    # TS/Vite half only — the Rust/Tauri binary is built + smoke-run locally
    # (CI runners lack the signing context; the webview build still gates types).
    name: Desktop Build (TS)
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # corepack-managed pnpm (from the packageManager field). The
      # pnpm/action-setup standalone wrapper hits a deterministic linker
      # ENOENT on this workspace (see pnpm/pnpm#9249 + the probe runs:
      # apps/api exists before AND after, yet its node_modules mkdir
      # 'fails') — the identical install passes with corepack pnpm on
      # macOS and Linux-docker. No pnpm caches existed, so `cache: pnpm`
      # is dropped with nothing lost.
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      # [TA-S0-006] Arm every server-only secret with a canary BEFORE the build,
      # so the artifact scan after it can prove no server secret was inlined.
      - name: Arm the secret canaries
        run: node scripts/secret-canary.js --emit >> "$GITHUB_ENV"
      - run: pnpm --filter @swift/desktop build
      # [TA-S0-006] The desktop app was outside every artifact gate: Vite
      # inlines VITE_* through import.meta.env, and dist/ is exactly what the
      # packaged app carries.
      # [SCR-006] What the build IS: its manifest (every file's digest, the entrypoints, the commit), so the gate
      # certifies THIS artifact and writes a receipt for it; both stay with the run as the scan attestation.
      - name: Artifact manifest (desktop)
        run: node scripts/artifact-manifest.js apps/desktop/dist --app desktop --commit ${{ github.sha }} --entry index.html --out artifact-desktop.manifest.json
      - name: No unlisted public variable reached the desktop bundle
        run: node scripts/public-secrets-gate.js --bundle apps/desktop/dist --manifest artifact-desktop.manifest.json --app desktop --commit ${{ github.sha }} --receipt artifact-desktop.receipt.json
      - name: Keep the desktop manifest and scan receipt with the run
        uses: actions/upload-artifact@v7
        with:
          name: artifact-desktop-attestation
          path: |
            artifact-desktop.manifest.json
            artifact-desktop.receipt.json
          if-no-files-found: error
      - name: No server secret reached the desktop bundle
        run: node scripts/secret-canary.js --scan apps/desktop/dist
      - name: No secret-shaped value in the desktop bundle
        run: bash scripts/fetch-gitleaks.sh && ./gitleaks detect --no-git --source apps/desktop/dist --redact --exit-code 1
      # [V11] Mission Control approves identity documents and enforces the
      # liability gate — it must not sit outside the lint net. (18 real errors
      # once sat on main unnoticed because CI only type-built this package.)
      - run: pnpm exec eslint apps/desktop/src --ext .ts,.tsx --max-warnings=0

  # Broken or drifted migrations must fail CI, not the deploy: replay every
  # committed migration on a clean DB, then prove the result matches
  # schema.prisma exactly (validated locally: expression GIST indexes that live
  # only in migrations do not false-positive the diff).
  migration-check:
    name: Migration Replay
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: swift
          POSTGRES_PASSWORD: swift
          POSTGRES_DB: swift_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U swift"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # corepack-managed pnpm (from the packageManager field). The
      # pnpm/action-setup standalone wrapper hits a deterministic linker
      # ENOENT on this workspace (see pnpm/pnpm#9249 + the probe runs:
      # apps/api exists before AND after, yet its node_modules mkdir
      # 'fails') — the identical install passes with corepack pnpm on
      # macOS and Linux-docker. No pnpm caches existed, so `cache: pnpm`
      # is dropped with nothing lost.
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      - name: Replay all migrations on a clean database
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_migrate
      # SWIFT-AUD-D6-04: the two dispatch geo indexes are functional GiST, which
      # Prisma can't express in schema.prisma — they live ONLY in raw-SQL
      # migrations and are invisible to `db push`. Assert `migrate deploy`
      # actually created them, so a regression (or a db-push-provisioned env)
      # that would silently degrade dispatch to a full table seq-scan goes RED.
      - name: Dispatch geo GiST indexes exist
        run: |
          for idx in riders_geo_gist drivers_geo_gist; do
            found=$(psql "postgresql://swift:swift@localhost:5432/swift_migrate" -tAc "SELECT 1 FROM pg_indexes WHERE indexname='$idx'")
            if [ "$found" != "1" ]; then echo "::error::MISSING dispatch geo index: $idx (raw-SQL migration did not apply)"; exit 1; fi
            echo "ok: $idx present"
          done
      # Like the GiST indexes, the money-integrity CHECK constraints are raw-SQL
      # (Prisma can't model them) so they live only in migrations and are absent
      # from a db-push'd env. Assert `migrate deploy` created them — the
      # zero-commission (keep-100%) guard degrading silently must go RED.
      - name: Money-integrity CHECK constraints exist
        run: |
          DB="postgresql://swift:swift@localhost:5432/swift_migrate"
          for c in chk_orders_zero_markup chk_order_items_zero_markup chk_orders_nonneg_money chk_order_items_qty_positive; do
            found=$(psql "$DB" -tAc "SELECT 1 FROM pg_constraint WHERE conname='$c'")
            if [ "$found" != "1" ]; then echo "::error::MISSING money CHECK constraint: $c (raw-SQL migration did not apply)"; exit 1; fi
            echo "ok: $c present"
          done
      # TOLLGATE ledger laws are raw-SQL too (deferred balanced-transaction
      # trigger, append-only triggers, one-side/nonneg CHECKs) — assert replay
      # created them; the books silently losing their laws must go RED.
      - name: Ledger-integrity constraints and triggers exist
        run: |
          DB="postgresql://swift:swift@localhost:5432/swift_migrate"
          for c in ledger_entries_one_side ledger_entries_nonneg prepaid_balance_nonneg; do
            found=$(psql "$DB" -tAc "SELECT 1 FROM pg_constraint WHERE conname='$c'")
            if [ "$found" != "1" ]; then echo "::error::MISSING ledger CHECK constraint: $c (raw-SQL migration did not apply)"; exit 1; fi
            echo "ok: $c present"
          done
          for t in ledger_txn_balanced ledger_entries_append_only ledger_transactions_append_only; do
            found=$(psql "$DB" -tAc "SELECT 1 FROM pg_trigger WHERE tgname='$t'")
            if [ "$found" != "1" ]; then echo "::error::MISSING ledger trigger: $t (raw-SQL migration did not apply)"; exit 1; fi
            echo "ok: $t present"
          done
      # DCR-1 NR-1: the consent ledger's append-only trigger is raw SQL too —
      # consent history silently becoming rewritable must go RED.
      - name: Consent append-only trigger exists
        run: |
          DB="postgresql://swift:swift@localhost:5432/swift_migrate"
          found=$(psql "$DB" -tAc "SELECT 1 FROM pg_trigger WHERE tgname='consent_records_no_mutation'")
          if [ "$found" != "1" ]; then echo "::error::MISSING consent trigger: consent_records_no_mutation (raw-SQL migration did not apply)"; exit 1; fi
          echo "ok: consent_records_no_mutation present"
      # ELV-1 W-201: the database tenant wall — RLS enabled + tenant_isolation
      # policy on every tenant-bearing table. The wall silently shrinking must
      # go RED. Keep the expected count in lockstep with TENANT_TABLES
      # (src/lib/tenant-rls.ts); the suite's census test guards the list itself.
      - name: Tenant RLS wall is complete
        # [REPORT-033 #13] This used to assert only a COUNT (52), so one
        # missing table swapped for one unexpected table passed — and every
        # new table meant hand-editing YAML. Now the actual walled-table NAME
        # SET is diffed against TENANT_TABLES (src/lib/tenant-rls.ts) — the
        # registry the suite's census test already pins 1:1 to the Prisma
        # DMMF — so a table self-enrols by being registered, and any drift
        # names the exact table.
        run: |
          DB="postgresql://swift:swift@localhost:5432/swift_migrate"
          expected=$(awk '/export const TENANT_TABLES = \[/,/\] as const;/' apps/api/src/lib/tenant-rls.ts | grep -o "'[^']*'" | tr -d "'" | sort)
          [ -n "$expected" ] || { echo "::error::Could not extract TENANT_TABLES from tenant-rls.ts — the extraction pattern needs updating"; exit 1; }
          actual=$(psql "$DB" -tAc "SELECT c.relname FROM pg_class c JOIN pg_namespace ns ON ns.oid=c.relnamespace JOIN pg_policy p ON p.polrelid=c.oid AND p.polname='tenant_isolation' WHERE ns.nspname='public' AND c.relrowsecurity ORDER BY 1")
          if ! diff <(echo "$expected") <(echo "$actual"); then
            echo "::error::Tenant RLS wall drifted from TENANT_TABLES — lines prefixed < are registered but NOT walled; > are walled but NOT registered"
            exit 1
          fi
          echo "ok: $(echo "$expected" | grep -c .) tables walled, name-for-name"
      - name: Tenant RLS predicate is the role capability, not the GUC
        # [F-021-11 repair] The check above asks whether a policy EXISTS. It
        # cannot see WHAT the policy says — so `20260828120000_algo_config`,
        # which installed its policy by copying an older migration's DDL text
        # instead of calling rlsDdlFor(), shipped the retired bypass:
        #   OR current_setting('app.bypass_tenant', true) = 'on'
        # A GUC is settable by the very role the wall constrains, which is why
        # that form was replaced by membership in swift_bypass_rls. It passed
        # the name-set diff, the census test and the suite, because all four
        # were counting policies rather than reading them.
        #
        # This runs against swift_migrate — a database built by REPLAYING the
        # migrations — so it grades the migrations themselves, with no test
        # installer able to heal the answer first.
        run: |
          DB="postgresql://swift:swift@localhost:5432/swift_migrate"
          drifted=$(psql "$DB" -tAc "
            SELECT c.relname FROM pg_class c
            JOIN pg_namespace ns ON ns.oid = c.relnamespace
            JOIN pg_policy p ON p.polrelid = c.oid AND p.polname = 'tenant_isolation'
            WHERE ns.nspname = 'public' AND c.relrowsecurity
              AND (pg_get_expr(p.polqual, p.polrelid) NOT LIKE '%pg_has_role%'
                OR pg_get_expr(p.polqual, p.polrelid) LIKE '%bypass_tenant%'
                OR pg_get_expr(p.polwithcheck, p.polrelid) NOT LIKE '%pg_has_role%'
                OR pg_get_expr(p.polwithcheck, p.polrelid) LIKE '%bypass_tenant%')
            ORDER BY 1")
          if [ -n "$drifted" ]; then
            echo "::error::Tenant RLS predicate drifted on: $(echo $drifted). The bypass must be membership in the swift_bypass_rls ROLE, never the app.bypass_tenant GUC (REPORT-021 F-021-11). Install policies with rlsDdlFor() from src/lib/tenant-rls.ts — never by copying an older migration's DDL."
            exit 1
          fi
          echo "ok: every walled table bypasses by role capability, none by GUC"
      - name: Schema matches migration state
        run: >
          cd apps/api && npx prisma migrate diff
          --from-url postgresql://swift:swift@localhost:5432/swift_migrate
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  # The repo is public — scan the full history for leaked credentials on every
  # push/PR. Blocking by design.
  ui-barrier:
    name: UI Barrier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # An ESLint rule can be silenced with an inline disable comment. This
      # cannot — removing it shows up in the diff. It guards the one-way door
      # between the new UI tree and the legacy kit, and it permanently forbids a
      # second palette outside packages/ui.
      - name: Old UI cannot touch new UI
        run: bash scripts/ui-barrier.sh

  # [TA-S0-006] The JS half of every APK/IPA is exactly what `expo export`
  # writes — the bundles, the assets, the manifest — and until this job it was
  # outside every artifact gate. Native binaries add nothing the JS did not
  # carry, bar the Android maps key that lives in the manifest BY DESIGN (see
  # scripts/secret-canary.js). The app config refuses a CI export without that
  # key, so this gate hands it a placeholder that is visibly not a key: this
  # export is a gate, never a distributable.
  mobile-bundle-gate:
    name: Mobile Bundle Gate
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: corepack enable && corepack prepare --activate
      - run: pnpm install --frozen-lockfile || pnpm install --frozen-lockfile
      - name: Arm the secret canaries
        run: node scripts/secret-canary.js --emit >> "$GITHUB_ENV"
      - name: Export the mobile JS bundles
        working-directory: apps/mobile
        env:
          ANDROID_GOOGLE_MAPS_API_KEY: ci-gate-placeholder-not-a-key
        run: |
          npx expo export --platform ios --output-dir dist/ios
          npx expo export --platform android --output-dir dist/android
      # [SCR-006] What the build IS: its manifest (every file's digest, the entrypoints, the commit), so the gate
      # certifies THIS artifact and writes a receipt for it; both stay with the run as the scan attestation.
      - name: Artifact manifest (mobile)
        run: node scripts/artifact-manifest.js apps/mobile/dist --app mobile --commit ${{ github.sha }} --entry ios/metadata.json --entry android/metadata.json --out artifact-mobile.manifest.json
      - name: No unlisted public variable reached the mobile bundles
        run: node scripts/public-secrets-gate.js --bundle apps/mobile/dist --manifest artifact-mobile.manifest.json --app mobile --commit ${{ github.sha }} --receipt artifact-mobile.receipt.json
      - name: Keep the mobile manifest and scan receipt with the run
        uses: actions/upload-artifact@v7
        with:
          name: artifact-mobile-attestation
          path: |
            artifact-mobile.manifest.json
            artifact-mobile.receipt.json
          if-no-files-found: error
      - name: No server secret reached the mobile bundles
        run: node scripts/secret-canary.js --scan apps/mobile/dist
      - name: No secret-shaped value in the mobile bundles
        run: bash scripts/fetch-gitleaks.sh && ./gitleaks detect --no-git --source apps/mobile/dist --redact --exit-code 1

  public-env-gate:
    name: Public Env Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # [GRD-1 §2 / WS-15] gitleaks (below) scans for values that LOOK like
      # credentials. It cannot catch this class: someone writes
      # `process.env.NEXT_PUBLIC_MMG_SECRET`, the source stays innocent, and the
      # real value is injected by the build straight into every bundle. So the
      # gate is on the NAME, before a value exists — each public-prefixed
      # variable must be allowlisted with a written justification, and a name
      # that reads like a secret needs an explicit marker on top of that.
      # No install needed: the script is dependency-free Node.
      - name: Every public-prefixed variable is allowlisted and justified
        run: node scripts/public-secrets-gate.js

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # [TA-S0-006 / Q.2] The scanner is fetched by one script that pins the
      # version AND its checksum — a replaced release asset fails loudly
      # instead of running as the tool that decides whether main is clean.
      - name: Run gitleaks over full history
        run: |
          bash scripts/fetch-gitleaks.sh
          ./gitleaks detect --source . --redact --exit-code 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Blocking: a HIGH CVE should red the build. `pnpm audit` (and audit-ci,
      # which shells out to it) died 2026-07-14 when the npm registry retired
      # its audits endpoint (410 Gone) with no fixed pnpm release available —
      # Trivy reads pnpm-lock.yaml directly against the GHSA/OSV feeds with the
      # same HIGH+ blocking threshold, version-pinned like gitleaks above.
      - name: Audit dependencies (HIGH+ blocks)
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz | tar -xz trivy
          ./trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 pnpm-lock.yaml
