name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      - run: pnpm lint
      - run: pnpm type-check
      - name: Mobile unit tests
        run: pnpm --filter @swift/mobile test

  api-test:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: swift
          POSTGRES_PASSWORD: swift
          POSTGRES_DB: swift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U swift"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      - name: Run database migrations
        run: cd apps/api && npx prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
      - name: Seed database
        run: cd apps/api && npx prisma db seed
        env:
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
          REDIS_URL: redis://localhost:6379
      - name: Run tests
        run: pnpm --filter @swift/api test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-jwt-secret-not-for-production

      # Step 15: an untested backup does not exist. Dump the post-suite
      # database and prove it restores into a scratch DB with sane contents.
      - name: Backup the database (pg_dump)
        run: pg_dump "postgresql://swift:swift@localhost:5432/swift_test" -Fc -f /tmp/swift-ci.dump
      - name: Restore into a scratch DB and sanity-check
        env:
          PGPASSWORD: swift
        run: |
          createdb -h localhost -U swift swift_restore_check
          pg_restore --no-owner -h localhost -U swift -d swift_restore_check /tmp/swift-ci.dump
          USERS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM users;')
          CONFIGS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM country_configs;')
          VENDORS=$(psql -h localhost -U swift -d swift_restore_check -tAc 'SELECT count(*) FROM vendors;')
          echo "restored: users=$USERS country_configs=$CONFIGS vendors=$VENDORS"
          test "$USERS" -ge 4
          test "$CONFIGS" -ge 1
          test "$VENDORS" -ge 4

  api-build:
    name: API Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cd apps/api && npx prisma generate
      - run: pnpm --filter @swift/api build

  admin-build:
    name: Admin Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swift/admin build

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swift/web build

  desktop-build:
    # TS/Vite half only — the Rust/Tauri binary is built + smoke-run locally
    # (CI runners lack the signing context; the webview build still gates types).
    name: Desktop Build (TS)
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @swift/desktop build

  # Broken or drifted migrations must fail CI, not the deploy: replay every
  # committed migration on a clean DB, then prove the result matches
  # schema.prisma exactly (validated locally: expression GIST indexes that live
  # only in migrations do not false-positive the diff).
  migration-check:
    name: Migration Replay
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: swift
          POSTGRES_PASSWORD: swift
          POSTGRES_DB: swift_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U swift"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replay all migrations on a clean database
        run: cd apps/api && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://swift:swift@localhost:5432/swift_migrate
      # SWIFT-AUD-D6-04: the two dispatch geo indexes are functional GiST, which
      # Prisma can't express in schema.prisma — they live ONLY in raw-SQL
      # migrations and are invisible to `db push`. Assert `migrate deploy`
      # actually created them, so a regression (or a db-push-provisioned env)
      # that would silently degrade dispatch to a full table seq-scan goes RED.
      - name: Dispatch geo GiST indexes exist
        run: |
          for idx in riders_geo_gist drivers_geo_gist; do
            found=$(psql "postgresql://swift:swift@localhost:5432/swift_migrate" -tAc "SELECT 1 FROM pg_indexes WHERE indexname='$idx'")
            if [ "$found" != "1" ]; then echo "::error::MISSING dispatch geo index: $idx (raw-SQL migration did not apply)"; exit 1; fi
            echo "ok: $idx present"
          done
      - name: Schema matches migration state
        run: >
          cd apps/api && npx prisma migrate diff
          --from-url postgresql://swift:swift@localhost:5432/swift_migrate
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

  # The repo is public — scan the full history for leaked credentials on every
  # push/PR. Blocking by design.
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks over full history
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --redact --exit-code 1

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Blocking: a HIGH CVE should red the build. `pnpm audit` (and audit-ci,
      # which shells out to it) died 2026-07-14 when the npm registry retired
      # its audits endpoint (410 Gone) with no fixed pnpm release available —
      # Trivy reads pnpm-lock.yaml directly against the GHSA/OSV feeds with the
      # same HIGH+ blocking threshold, version-pinned like gitleaks above.
      - name: Audit dependencies (HIGH+ blocks)
        run: |
          curl -sSfL https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz | tar -xz trivy
          ./trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 pnpm-lock.yaml
