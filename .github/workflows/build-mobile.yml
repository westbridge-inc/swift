name: Build Mobile

# Mobile stack is React Native (Expo). The old Flutter scaffold (apps/mobile-flutter)
# was removed; its CI jobs were deleted with it. The mobile type-check / lint / test
# gate runs in the main CI workflow (ci.yml). This manual job is a standalone build
# check for the RN app.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-native-build:
    name: React Native Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --ext .ts,.tsx
        continue-on-error: true
