name: Build Mobile

# Mobile stack is React Native (Expo). The old Flutter scaffold (apps/mobile-flutter)
# was removed; its CI jobs were deleted with it. The mobile type-check / lint / test
# gate runs in the main CI workflow (ci.yml). This manual job is a standalone build
# check for the RN app.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  react-native-build:
    name: React Native Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # corepack-managed pnpm (from the packageManager field). The
      # pnpm/action-setup standalone wrapper hits a deterministic linker
      # ENOENT on this workspace (see pnpm/pnpm#9249 + the probe runs:
      # apps/api exists before AND after, yet its node_modules mkdir
      # 'fails') — the identical install passes with corepack pnpm on
      # macOS and Linux-docker. No pnpm caches existed, so `cache: pnpm`
      # is dropped with nothing lost.
      - run: corepack enable && corepack prepare --activate

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --ext .ts,.tsx
        continue-on-error: true
