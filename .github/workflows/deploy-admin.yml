name: Deploy Admin

# Manual-only until VERCEL_TOKEN is configured (playbook Step 15 — deploys
# come at hardening). Was failing on every push since April with no token.
on:
  workflow_dispatch:

concurrency:
  group: deploy-admin
  cancel-in-progress: false

# Deploys need nothing from the repo-scoped GITHUB_TOKEN beyond checkout.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Admin to Vercel
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        # Token flows via env, not a CLI argument — argv is visible to every
        # process on the runner; env vars are not.
        run: |
          npx vercel --prod --token="$VERCEL_TOKEN" \
            --scope=${{ vars.VERCEL_ORG_ID }} \
            --yes
        working-directory: apps/admin
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
