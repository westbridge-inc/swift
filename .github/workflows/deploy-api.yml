name: Deploy API

# Manual fail-closed sentinel. Production authority cutover cannot use a
# generic rolling deploy and the repository does not yet contain the reviewed
# Fly manifest/process-group controls needed to automate the non-rolling path.
on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions: {}

jobs:
  cutover-required:
    name: Block unsafe API deployment path
    runs-on: ubuntu-latest
    steps:
      # SECURITY CUTOVER GUARD (2026-08-08): this legacy workflow migrates an
      # old serving Machine and then performs a rolling deploy/automatic binary
      # rollback. That is incompatible with the session-owned mover-location
      # authority cutover, which requires every old API/worker Machine to be
      # stopped before migration and forbids resuming the old binary after new
      # owners exist. Fail closed until the real Fly manifest/process groups
      # are checked in and this workflow is replaced by the independently
      # reviewed non-rolling procedure in MOVER-AUTHORITY-CUTOVER-RUNBOOK.md.
      - name: Block obsolete rolling deployment path
        run: |
          echo "::error::Production deploy is intentionally blocked: the mover-authority release requires a coordinated non-rolling cutover."
          echo "Follow apps/api/MOVER-AUTHORITY-CUTOVER-RUNBOOK.md and replace this workflow only after the Fly manifest, process groups, maintenance controls, and rollback proof exist."
          exit 1
