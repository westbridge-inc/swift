# One-off PRODUCTION-SPINE SEED ceremony — used ONLY by deploy/seed-production.sh.
# Never part of `docker compose up`: the service below exists so `docker compose
# run --rm seed` can execute prisma/seed-production.ts against the stack's
# private Postgres. The RUNTIME image carries dist/ but no src/ or tsx, so this
# service builds the Dockerfile's `build` stage, which has both.
#
# Secrets: dist/boot/secret-files.js is imported FIRST and turns *_FILE into
# process env + assembles DATABASE_URL in memory; tsx inherits them as a child.
# DATABASE_URL therefore exists only inside the container process, never in
# this config, in argv, or in any log the wrapper prints.
services:
  seed:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: build
    image: swift-api-seed:${SWIFT_TAG:-local}
    command:
      - node
      - -e
      - |
        require('./dist/boot/secret-files.js');
        const { spawnSync } = require('node:child_process');
        const result = spawnSync(process.execPath, [require.resolve('tsx/cli'), 'prisma/seed-production.ts'], { stdio: 'inherit' });
        if (result.error) {
          console.error('FATAL: could not start tsx: ' + result.error.message);
          process.exit(1);
        }
        process.exit(result.status ?? 1);
    environment:
      # The same posture as the api/worker (deploy/.env). The seed calls
      # isProduction() (seedFxRate), and runtime-mode refuses an unset
      # NODE_ENV rather than guessing, so without this line the promotion
      # died before any write while sign mode (which returns earlier) passed.
      NODE_ENV: ${NODE_ENV:?set NODE_ENV explicitly (production|development|test|loadtest) — the seed refuses to guess its posture}
      # The operator-recorded GYD/USD rate. Required only on a production
      # posture (seedFxRate); empty elsewhere falls back to the dev/test rate.
      SEED_FX_GYD_PER_USD: ${SEED_FX_GYD_PER_USD:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      POSTGRES_DB: ${POSTGRES_DB:-swift}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      # The first SUPER_ADMIN (E.164). Required by seed-production.sh.
      SEED_ADMIN_PHONE: ${SEED_ADMIN_PHONE:-}
      SEED_ACTOR: ${SEED_ACTOR:-seed-production}
      # The two-person break-glass ceremony (runbook §6). Empty unless
      # seed-production.sh runs it: the key arrives as a FILE from the
      # encrypted store; approvals and the signer's name are not secrets.
      SEED_PLAN_SECRET_FILE: ${SEED_PLAN_SECRET_FILE:-}
      SEED_PROMOTION_APPROVALS: ${SEED_PROMOTION_APPROVALS:-}
      SEED_SIGN_APPROVER: ${SEED_SIGN_APPROVER:-}
    volumes:
      - /run/swift-secrets:/run/secrets:ro
    networks: [private]
    restart: "no"
