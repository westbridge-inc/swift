# [SUP-001 · Codex REPORT-075] IMAGES ARE PINNED BY DIGEST, NOT BY TAG.
#
# A tag is a pointer its publisher can move. `docker compose pull` against a
# mutable tag can hand a production host different software than the one that
# was tested, with no diff and no signal. A digest is a content address: it
# resolves to exactly those bytes or it fails.
#
# The tag is kept beside the digest so a human can still read which version this
# is. To update one deliberately:
#
#     docker buildx imagetools inspect <repo>:<newtag>     # prints the digest
#     # then edit BOTH the tag and the digest here, in one commit, with a reason
#
# `container-image-pinning.test.ts` fails the build if a service is added
# without a digest, or pinned to `latest`.
#
# PLATFORM: THIS STACK REQUIRES AN amd64 (x86_64) HOST. Two of these images
# publish a SINGLE amd64 manifest, not a multi-platform index:
#
#     postgis/postgis:16-3.4       linux/amd64 only
#     osrm/osrm-backend:v5.25.0    linux/amd64 only   (routing compose)
#
# Every other image here is amd64+arm64. So an ARM host — Ampere, Graviton, a
# Hetzner CAX box, an Apple-silicon laptop — cannot run Postgres or OSRM
# natively; it will refuse the pull or fall back to qemu emulation, which for
# PostGIS means a database several times slower than the hardware it is on.
# This is a property of the upstream images, not of pinning: the bare tags
# resolved to the same single manifests. Verify before changing a host:
#
#     docker buildx imagetools inspect <repo>:<tag> | grep Platform
#
# (no Platform lines at all = a single-platform image; check its config with
#  `docker image inspect <ref> --format '{{.Os}}/{{.Architecture}}'`)

# Swift — the self-hosted routing and geocoding stack.
#
# This lived outside the repository, in a directory on one laptop, with a note
# at the top saying it was kept out of the public repo deliberately. Two things
# make that wrong rather than cautious:
#
#   • it holds NO secrets — every value here is a public image tag, a public
#     Geofabrik URL or a port number; and
#   • deploy/docker-compose.yml already publishes the whole topology anyway.
#
# What it cost was reproducibility: if that laptop died, the routing engine
# every ETA in the platform depends on could not be rebuilt from anything.
#
# SECURITY, stated plainly because it is real: none of these services has
# authentication. Firewall every published port to the API host only. They are
# published on the host at all so a developer can curl them; in production they
# should be reachable from the API and nothing else.
#
# DISK, because it filled a machine to zero bytes on 4 Sep 2026. Two of these
# four services are small and two are not, so they are no longer one command.
# The default brings up the pair the platform actually routes on:
#
#   docker compose -f deploy/docker-compose.routing.yml up -d
#
# osrm + vroom, both proven on the Guyana extract — OSRM routed 1,917 m in
# 200 s inside Georgetown, VROOM batched two shipments into 362 s.
#
# The geocoders are opt-in, because each one costs more than a laptop has:
#
#   docker compose -f deploy/docker-compose.routing.yml --profile geocoding up -d
#
# Photon downloads a 6.72 GB index and then EXTRACTS it, which needs roughly
# the same again while both copies exist; Nominatim imports the extract into
# its own PostgreSQL. Budget ~20 GB free for Photon before starting it, and
# treat both as VPS services. `restart: unless-stopped` means Docker brings
# a started one back on every daemon boot, so a half-finished index resumes
# filling the disk after a reboot — `docker rm -f` it, do not just stop it.
#
# Data is built by ./setup-routing.sh first — see that file.

services:
  # ── Routing and ETA ────────────────────────────────────────────────────
  # MAPS_PROVIDER=osrm  OSRM_URL=http://<host>:5001
  #
  # NOTE THE PORT. The container listens on 5000; the host publishes 5001.
  # The previous copy of this file documented OSRM_URL as :5000, which is the
  # CONTAINER port — correct only from inside this compose network, and wrong
  # for the API, which reaches it across the host. A routing URL that silently
  # refuses connections degrades every ETA to the haversine fallback, and the
  # only visible symptom is that distances get slightly worse.
  osrm:
    image: osrm/osrm-backend:v5.25.0@sha256:bdfa60e64ae1376bff6ff5605991be50600132a27469a4a9e77c23afd3a6d555
    container_name: swift-osrm
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/guyana-latest.osrm
    volumes:
      - ./routing-data/osrm:/data
    ports:
      - "5001:5000"
    restart: unless-stopped

  # ── Batch planning ─────────────────────────────────────────────────────
  # BATCH_PLANNER=vroom  VROOM_URL=http://<host>:3010   (container port 3000)
  # Sits on OSRM for travel times; stateless, so it needs no data build.
  vroom:
    image: vroomvrp/vroom-docker:v1.13.0@sha256:2e417553320bf68a25f6614ba8bdc31b0b2fc1172f8c25518c4656f488031c2a
    container_name: swift-vroom
    environment:
      - VROOM_ROUTER=osrm
    volumes:
      - ./routing-conf/vroom:/conf
    ports:
      - "3010:3000"
    depends_on:
      - osrm
    restart: unless-stopped

  # ── Address search and geocoding ───────────────────────────────────────
  # PLACES_PROVIDER=osm  PHOTON_URL=http://<host>:2322
  #
  # REGION picks the prebuilt index, and every number here was measured by
  # starting the container rather than read off a page:
  #
  #   unset / COUNTRY_CODE   →  PLANET, 58.05 GB
  #   REGION=GY              →  refused: "Must be a valid continent,
  #                             sub-region, or 'planet'"
  #   REGION=south-america   →  6.72 GB          ← what Guyana needs
  #
  # Two traps, and they fail in opposite ways. `COUNTRY_CODE=gy` is what this
  # file said first; the image does not read that variable AT ALL, so it fell
  # back to the planet and began a 58 GB download without a warning — it just
  # logs "Downloading index" and fills the disk. `REGION=GY` looks more
  # correct and is refused outright, which is the honest failure: Photon's
  # prebuilt indexes are continents and a handful of sub-regions, and South
  # America's only sub-region is Argentina. So Guyana takes the continent.
  #
  # Set it explicitly. The dangerous value is the one that is missing.
  photon:
    image: rtuszik/photon-docker:2.4.0@sha256:21549c60f9e6488fff3217e40429a652c4b445f374800333fe32859e47cec293
    container_name: swift-photon
    profiles: ["geocoding"]
    environment:
      - REGION=south-america
    volumes:
      - ./routing-data/photon:/photon/photon_data
    ports:
      - "2322:2322"
    restart: unless-stopped

  # NOMINATIM_URL=http://<host>:8080 — reverse geocoding (coordinates → address).
  # The heavy one: it imports the extract into its own PostgreSQL. One-time,
  # disk- and RAM-hungry, and the only member of this stack that is.
  nominatim:
    image: mediagis/nominatim:4.4@sha256:b772911424d31f8c36b337fe4b8d4ef3b93d4bf09f96407905a1e9d475d42632
    container_name: swift-nominatim
    profiles: ["geocoding"]
    environment:
      - PBF_URL=https://download.geofabrik.de/south-america/guyana-latest.osm.pbf
      - IMPORT_WIKIPEDIA=false
    volumes:
      - ./routing-data/nominatim:/var/lib/postgresql/14/main
    ports:
      - "8080:8080"
    shm_size: 1g
    restart: unless-stopped
