# ===========================================================================
# Swift — self-host / STAGING stack. The reviewed one-server sequence is
# deploy/pilot-up.sh with an exact approved commit SHA.
#
# This is the SAFE hosting path: a single-host deployment for staging, demos,
# and pre-launch validation. It is NOT the production cutover — that path is
# intentionally gated by .github/workflows/deploy-api.yml.
#
# Services: postgres (PostGIS), redis, meilisearch, the API, and a dedicated
# BullMQ worker (so N API replicas never process a job N times).
#
# SECRETS are never container environment VALUES: Docker persists those in the
# container config on disk and `docker inspect` prints them. Every secret is a
# file on tmpfs, decrypted from the encrypted host store by deploy/swift-secrets
# (swift-secrets.service at boot, pilot-up.sh on deploy) into /run/swift-secrets,
# bind-mounted read-only at /run/secrets. The app reads NAME_FILE=/run/secrets/NAME
# (apps/api/src/utils/secret-files.ts); the postgres image reads its *_FILE
# natively; the search image reads its file inside its own shell. deploy/.env
# holds settings only, and pilot-up.sh refuses one that holds a secret.
# ===========================================================================
name: swift

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      # Read by the image's entrypoint as root, before it drops to postgres;
      # the file is 0400 for the API's uid and never enters this config.
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_DB: ${POSTGRES_DB:-swift}
    volumes:
      - swift-pgdata:/var/lib/postgresql/data
      - /run/swift-secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swift} -d ${POSTGRES_DB:-swift}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published port — only members of the private Docker network reach it.
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - swift-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  meilisearch:
    image: getmeili/meilisearch:v1.9
    restart: unless-stopped
    # The image has no *_FILE support and its only alternatives are an
    # environment value or a --master-key argument (argv, visible in ps). So
    # tini stays PID 1 (the image entrypoint) and a shell reads the key from
    # the tmpfs file into the meilisearch process's own environment, nowhere
    # else. `$$` is Compose escaping: the shell, not Compose, expands it.
    command: ["/bin/sh", "-c", "MEILI_MASTER_KEY=\"$$(cat /run/secrets/MEILISEARCH_KEY)\" exec /bin/meilisearch"]
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - swift-meilidata:/meili_data
      - /run/swift-secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  # One-shot: apply migrations before the API/worker boot. Compose waits on its
  # completion via service_completed_successfully.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: swift-api:${SWIFT_TAG:-local}
    # The Prisma CLI reads DATABASE_URL from its environment and cannot read a
    # *_FILE, so dist/boot/migrate-deploy.js runs the secret-file loader first
    # and then invokes the Prisma binary directly — NOT `pnpm exec` (which
    # re-triggers corepack and pulls a newer pnpm needing Node 22). The runtime
    # image already carries the CLI and the generated engine.
    command: ["node", "dist/boot/migrate-deploy.js"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      POSTGRES_DB: ${POSTGRES_DB:-swift}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    volumes:
      - /run/swift-secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: swift-api:${SWIFT_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      # Staging with the bundled mock providers runs in development mode — the
      # app's production guard (correctly) REFUSES mock KYC/MMG/card rails when
      # NODE_ENV=production (SPS-F-0011). Flip to production ONLY once every
      # provider in .env is a real credential (that's the LB-010 boundary).
      NODE_ENV: ${NODE_ENV:?set NODE_ENV explicitly (production|development|test|loadtest) — the API refuses to guess its posture}
      HOST: 0.0.0.0
      PORT: "3000"
      # The database credential as PARTS plus a password file; the app
      # assembles DATABASE_URL in memory (a URL with the password inside it
      # would be a secret in this config).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      POSTGRES_DB: ${POSTGRES_DB:-swift}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY_FILE: /run/secrets/MEILISEARCH_KEY
      # Generated by deploy/gen-secrets.sh straight into the store. Provider
      # secrets (Twilio, SMTP, MMG, card rails, object storage, KYC) are wired
      # the same way from .env as NAME_FILE=/run/secrets/NAME when a provider
      # is switched on; see .env.deploy.example.
      JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      OTP_HASH_SECRET_FILE: /run/secrets/OTP_HASH_SECRET
      MASTER_KEK_FILE: /run/secrets/MASTER_KEK
      STORAGE_SIGNING_SECRET_FILE: /run/secrets/STORAGE_SIGNING_SECRET
      CONSENT_IP_PEPPER_FILE: /run/secrets/CONSENT_IP_PEPPER
      ATTRIB_SALT_FILE: /run/secrets/ATTRIB_SALT
      IDENTITY_SALT_FILE: /run/secrets/IDENTITY_SALT
      SCAN_IP_SALT_FILE: /run/secrets/SCAN_IP_SALT
      ADS_EVENT_SECRET_FILE: /run/secrets/ADS_EVENT_SECRET
      # Read by the HTTP process only: the ops endpoints and the load-test
      # control plane. Not handed to the worker.
      METRICS_TOKEN_FILE: /run/secrets/METRICS_TOKEN
      HEALTH_DETAIL_TOKEN_FILE: /run/secrets/HEALTH_DETAIL_TOKEN
      TEST_CONTROL_SECRET_FILE: /run/secrets/TEST_CONTROL_SECRET
      # The API process serves HTTP only; the worker service below owns jobs.
      RUN_WORKERS: "0"
    volumes:
      - /run/swift-secrets:/run/secrets:ro
    # No host port: Caddy is the only public entrance.
    networks: [private]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  worker:
    image: swift-api:${SWIFT_TAG:-local}
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:?set NODE_ENV explicitly (production|development|test|loadtest) — the API refuses to guess its posture}
      # [P1] The worker sizes its own Prisma pool for its declared job
      # concurrency (src/utils/db-pool.ts; override with DB_POOL_SIZE_WORKER in
      # .env). Do NOT append ?connection_limit to the assembled URL — a limit
      # written into the URL is treated as a deliberate operator decision and
      # wins over the sizing, which is how this process ended up with five
      # connections for nineteen concurrent jobs in the first place.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      POSTGRES_DB: ${POSTGRES_DB:-swift}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY_FILE: /run/secrets/MEILISEARCH_KEY
      JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      OTP_HASH_SECRET_FILE: /run/secrets/OTP_HASH_SECRET
      MASTER_KEK_FILE: /run/secrets/MASTER_KEK
      STORAGE_SIGNING_SECRET_FILE: /run/secrets/STORAGE_SIGNING_SECRET
      CONSENT_IP_PEPPER_FILE: /run/secrets/CONSENT_IP_PEPPER
      ATTRIB_SALT_FILE: /run/secrets/ATTRIB_SALT
      IDENTITY_SALT_FILE: /run/secrets/IDENTITY_SALT
      SCAN_IP_SALT_FILE: /run/secrets/SCAN_IP_SALT
      ADS_EVENT_SECRET_FILE: /run/secrets/ADS_EVENT_SECRET
      RUN_WORKERS: "1"
    volumes:
      - /run/swift-secrets:/run/secrets:ro
    # The API image's HEALTHCHECK fetches its own HTTP readiness endpoint, but
    # the worker process (dist/worker.js) serves no HTTP — with the image
    # default the worker was permanently "unhealthy" while /health said
    # worker: ok.
    # This probe checks the SAME signal the API's health and readiness checks
    # use to decide the worker fleet is alive: the `scheduler:heartbeat` Redis
    # key the recurring scheduler-heartbeat job writes every 60s
    # (dist/boot/worker-probe.js).
    # This service is the only RUN_WORKERS=1 process, so a fresh key IS this
    # worker alive and consuming. start_period covers boot before the first beat.
    healthcheck:
      # `node -e` invokes the probe's exported main() explicitly, so importing
      # the module (in tests) never exits a process and the probe's exit code
      # is exactly its verdict.
      test: ["CMD", "node", "-e", "require('./dist/boot/worker-probe.js').main()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [private]

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - swift-caddy-data:/data
      - swift-caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_started
    networks: [private]

volumes:
  swift-pgdata:
  swift-redisdata:
  swift-meilidata:
  swift-caddy-data:
  swift-caddy-config:

networks:
  private:
    name: swift-pilot-private
    external: true
