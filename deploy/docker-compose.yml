# ===========================================================================
# Swift — self-host / STAGING stack. The reviewed one-server sequence is
# deploy/pilot-up.sh with an exact approved commit SHA.
#
# This is the SAFE hosting path: a single-host deployment for staging, demos,
# and pre-launch validation. It is NOT the production cutover — that path is
# intentionally gated by .github/workflows/deploy-api.yml.
#
# Services: postgres (PostGIS), redis, meilisearch, the upload malware scanner
# (clamd), the API, and a dedicated
# BullMQ worker (so N API replicas never process a job N times); optionally
# the website (profile "web", turned on by WEB_HOST) and the admin console
# (profile "admin", turned on by ADMIN_HOST).
#
# SECRETS are never container environment VALUES: Docker persists those in the
# container config on disk and `docker inspect` prints them. Every secret is a
# file on tmpfs, decrypted from the encrypted host store by deploy/swift-secrets
# (swift-secrets.service at boot, pilot-up.sh on deploy) into /run/swift-secrets,
# bind-mounted read-only at /run/secrets. The app reads NAME_FILE=/run/secrets/NAME
# (apps/api/src/utils/secret-files.ts); the postgres image reads its *_FILE
# natively; the search image reads its file inside its own shell. deploy/.env
# holds settings only, and pilot-up.sh refuses one that holds a secret.
# ===========================================================================
name: swift

services:
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      # Read by the image's entrypoint as root, before it drops to postgres;
      # the file is 0400 for the API's uid and never enters this config.
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_DB: ${POSTGRES_DB:-swift}
    volumes:
      - swift-pgdata:/var/lib/postgresql/data
      - /run/swift-secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swift} -d ${POSTGRES_DB:-swift}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published port — only members of the private Docker network reach it.
    networks: [private]

  redis:
    image: redis:7-alpine@sha256:57e4255cc971b1c8d6f8a6ca283ac01bc3ecdd914273ef6bfaede87aaecd6541
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - swift-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [private]

  meilisearch:
    image: getmeili/meilisearch:v1.9@sha256:2e540df681bfab567d449c8d7a2c5e513eb10a7aa87b13cc88da84a963a2490e
    restart: unless-stopped
    # The image has no *_FILE support and its only alternatives are an
    # environment value or a --master-key argument (argv, visible in ps). So
    # tini stays PID 1 (the image entrypoint) and a shell reads the key from
    # the tmpfs file into the meilisearch process's own environment, nowhere
    # else. `$$` is Compose escaping: the shell, not Compose, expands it.
    command: ["/bin/sh", "-c", "MEILI_MASTER_KEY=\"$$(cat /run/secrets/MEILISEARCH_KEY)\" exec /bin/meilisearch"]
    environment:
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - swift-meilidata:/meili_data
      - /run/swift-secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [private]

  # [Row 312] The upload malware scanner (ClamAV clamd), reached by the API and
  # the worker as clamd:3310 (INSTREAM over TCP, apps/api/src/lib/malware-scan.ts).
  # The bytes it reads are the PLAINTEXT of ID documents and selfies, so it sits
  # on the private network only: no published port, no Caddy route, and the
  # app itself refuses a scanner name that resolves off loopback/private
  # addresses. It reads no secret and not deploy/.env.
  # - Pinned by exact tag AND digest (1.4 is ClamAV's long-term-support line;
  #   the digest is the multi-arch index of 1.4.6 as published 19 Oct 2026).
  #   Bump both together, never the tag alone.
  # - Signatures live on swift-clamdb. A new volume starts from the image's own
  #   signatures (Docker copies them in), and freshclam updates them in place
  #   FRESHCLAM_CHECKS times a day (never more than hourly: the mirror rate-limits).
  # - Healthy ONLY once the signatures are loaded: clamd answers PING only after
  #   loading them, and VERSION names the loaded daily database. pilot-up.sh
  #   waits for this, then proves an EICAR test string is refused through the
  #   API's own gate, before it stops the running API.
  # - Memory, measured 21 Oct 2026 (1.4.6, daily 28157): ~950 MiB with the
  #   signatures loaded; ~2.0 GiB at the peak of a signature reload (clamd loads
  #   the new engine beside the old one, so scanning never stalls). The ceiling
  #   leaves room for that peak and for the signatures to grow; hitting it
  #   restarts the scanner (uploads refused meanwhile, and the worker's
  #   malware-scanner-watch pages ops after two failed asks).
  clamd:
    image: clamav/clamav:1.4.6@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    restart: unless-stopped
    environment:
      FRESHCLAM_CHECKS: "12"
    volumes:
      - swift-clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(echo PING | nc localhost 3310)\" = PONG ] && echo VERSION | nc localhost 3310 | grep -qE '^ClamAV [0-9.]+/[0-9]+/'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s
      start_interval: 5s
    mem_limit: 2560m
    security_opt:
      - no-new-privileges:true
    # No published port: only members of the private Docker network reach it.
    networks: [private]

  # One-shot: apply migrations before the API/worker boot. Compose waits on its
  # completion via service_completed_successfully.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: swift-api:${SWIFT_TAG:-local}
    # The Prisma CLI reads DATABASE_URL from its environment and cannot read a
    # *_FILE, so dist/boot/migrate-deploy.js runs the secret-file loader first
    # and then invokes the Prisma binary directly — NOT `pnpm exec` (which
    # re-triggers corepack and pulls a newer pnpm needing Node 22). The runtime
    # image already carries the CLI and the generated engine.
    command: ["node", "dist/boot/migrate-deploy.js"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      POSTGRES_DB: ${POSTGRES_DB:-swift}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    volumes:
      - /run/swift-secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [private]

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: swift-api:${SWIFT_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      # Staging with the bundled mock providers runs in development mode — the
      # app's production guard (correctly) REFUSES mock KYC/MMG/card rails when
      # NODE_ENV=production (SPS-F-0011). Flip to production ONLY once every
      # provider in .env is a real credential (that's the LB-010 boundary).
      NODE_ENV: ${NODE_ENV:?set NODE_ENV explicitly (production|development|test|loadtest) — the API refuses to guess its posture}
      HOST: 0.0.0.0
      PORT: "3000"
      # The database credential as PARTS plus a password file; the app
      # assembles DATABASE_URL in memory (a URL with the password inside it
      # would be a secret in this config).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      POSTGRES_DB: ${POSTGRES_DB:-swift}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY_FILE: /run/secrets/MEILISEARCH_KEY
      # Generated by deploy/gen-secrets.sh straight into the store. Provider
      # secrets (Twilio, SMTP, MMG, card rails, object storage, KYC) are wired
      # the same way from .env as NAME_FILE=/run/secrets/NAME when a provider
      # is switched on; see .env.deploy.example.
      JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      OTP_HASH_SECRET_FILE: /run/secrets/OTP_HASH_SECRET
      MASTER_KEK_FILE: /run/secrets/MASTER_KEK
      STORAGE_SIGNING_SECRET_FILE: /run/secrets/STORAGE_SIGNING_SECRET
      CONSENT_IP_PEPPER_FILE: /run/secrets/CONSENT_IP_PEPPER
      ATTRIB_SALT_FILE: /run/secrets/ATTRIB_SALT
      IDENTITY_SALT_FILE: /run/secrets/IDENTITY_SALT
      SCAN_IP_SALT_FILE: /run/secrets/SCAN_IP_SALT
      ADS_EVENT_SECRET_FILE: /run/secrets/ADS_EVENT_SECRET
      # Read by the HTTP process only: the ops endpoints and the load-test
      # control plane. Not handed to the worker.
      METRICS_TOKEN_FILE: /run/secrets/METRICS_TOKEN
      HEALTH_DETAIL_TOKEN_FILE: /run/secrets/HEALTH_DETAIL_TOKEN
      TEST_CONTROL_SECRET_FILE: /run/secrets/TEST_CONTROL_SECRET
      # [AUD-G7-023] Signs GET /public/emergency-policy (Ed25519; the app pins
      # the public half). Generated ON this host by
      # deploy/owner/emergency-policy-key.command; pilot-up refuses to deploy
      # until the store holds it, before anything running is stopped.
      EMERGENCY_POLICY_SIGNING_KEY_FILE: /run/secrets/EMERGENCY_POLICY_SIGNING_KEY
      # The API process serves HTTP only; the worker service below owns jobs.
      RUN_WORKERS: "0"
      STORAGE_DEPLOYMENT: managed
      # Both processes inherit the same S3 target and credential-file settings
      # from .env. Local storage is enabled ONLY by the shared-volume overlay;
      # an acknowledgement in .env alone must never select container disks.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_ALLOW_LOCAL: "0"
      # [Row 312] Every upload is scanned by the private clamd service before it
      # is stored; scanner down = uploads refused (503), never a silent pass.
      # ON by default; MALWARE_SCAN=off in deploy/.env takes it dark, which
      # pilot-up.sh refuses on production (owner, 21 Oct: on for launch).
      MALWARE_SCAN: ${MALWARE_SCAN:-clamd}
      CLAMD_HOST: clamd
      CLAMD_PORT: "3310"
    volumes:
      - /run/swift-secrets:/run/secrets:ro
    # No host port: Caddy is the only public entrance.
    networks: [private]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      clamd:
        condition: service_healthy

  worker:
    image: swift-api:${SWIFT_TAG:-local}
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:?set NODE_ENV explicitly (production|development|test|loadtest) — the API refuses to guess its posture}
      # [P1] The worker sizes its own Prisma pool for its declared job
      # concurrency (src/utils/db-pool.ts; override with DB_POOL_SIZE_WORKER in
      # .env). Do NOT append ?connection_limit to the assembled URL — a limit
      # written into the URL is treated as a deliberate operator decision and
      # wins over the sizing, which is how this process ended up with five
      # connections for nineteen concurrent jobs in the first place.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      POSTGRES_DB: ${POSTGRES_DB:-swift}
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      MEILISEARCH_KEY_FILE: /run/secrets/MEILISEARCH_KEY
      JWT_SECRET_FILE: /run/secrets/JWT_SECRET
      OTP_HASH_SECRET_FILE: /run/secrets/OTP_HASH_SECRET
      MASTER_KEK_FILE: /run/secrets/MASTER_KEK
      STORAGE_SIGNING_SECRET_FILE: /run/secrets/STORAGE_SIGNING_SECRET
      CONSENT_IP_PEPPER_FILE: /run/secrets/CONSENT_IP_PEPPER
      ATTRIB_SALT_FILE: /run/secrets/ATTRIB_SALT
      IDENTITY_SALT_FILE: /run/secrets/IDENTITY_SALT
      SCAN_IP_SALT_FILE: /run/secrets/SCAN_IP_SALT
      ADS_EVENT_SECRET_FILE: /run/secrets/ADS_EVENT_SECRET
      RUN_WORKERS: "1"
      STORAGE_DEPLOYMENT: managed
      # Both processes inherit the same S3 target and credential-file settings
      # from .env. Local storage is enabled ONLY by the shared-volume overlay;
      # an acknowledgement in .env alone must never select container disks.
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_ALLOW_LOCAL: "0"
      # [Row 312] Every upload is scanned by the private clamd service before it
      # is stored; scanner down = uploads refused (503), never a silent pass.
      # ON by default; MALWARE_SCAN=off in deploy/.env takes it dark, which
      # pilot-up.sh refuses on production (owner, 21 Oct: on for launch).
      MALWARE_SCAN: ${MALWARE_SCAN:-clamd}
      CLAMD_HOST: clamd
      CLAMD_PORT: "3310"
    volumes:
      - /run/swift-secrets:/run/secrets:ro
    # The API image's HEALTHCHECK fetches its own HTTP readiness endpoint, but
    # the worker process (dist/worker.js) serves no HTTP — with the image
    # default the worker was permanently "unhealthy" while /health said
    # worker: ok.
    # This probe checks the SAME signal the API's health and readiness checks
    # use to decide the worker fleet is alive: the `scheduler:heartbeat` Redis
    # key the recurring scheduler-heartbeat job writes every 60s
    # (dist/boot/worker-probe.js).
    # This service is the only RUN_WORKERS=1 process, so a fresh key IS this
    # worker alive and consuming. start_period covers boot before the first beat.
    healthcheck:
      # `node -e` invokes the probe's exported main() explicitly, so importing
      # the module (in tests) never exits a process and the probe's exit code
      # is exactly its verdict.
      test: ["CMD", "node", "-e", "require('./dist/boot/worker-probe.js').main()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clamd:
        condition: service_healthy
    networks: [private]

  caddy:
    image: caddy:2.10@sha256:c3d7ee5d2b11f9dc54f947f68a734c84e9c9666c92c88a7f30b9cba5da182adb
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:-localhost}
      API_ALIAS_HOST: ${API_ALIAS_HOST:-}
      # [Q11] The website's DNS name. Empty (the default) serves no website:
      # the Caddyfile adds it to the API's site only when it is set.
      WEB_HOST: ${WEB_HOST:-}
      # [Item 8] Extra names for the website (space-separated), e.g. the public
      # apex and www. Empty (the default) adds none.
      WEB_ALIAS_HOSTS: ${WEB_ALIAS_HOSTS:-}
      # [ADMIN-CONSOLE] The admin console's DNS name. Empty (the default)
      # serves no console. The optional second gate in front of it is a
      # bcrypt hash (the password never reaches this host); its user is
      # DERIVED from the same setting, `admin` exactly when the hash is set,
      # and the Caddyfile refuses to load one without the other.
      ADMIN_HOST: ${ADMIN_HOST:-}
      ADMIN_BASIC_AUTH_USER: ${ADMIN_BASIC_AUTH_HASH:+admin}
      ADMIN_BASIC_AUTH_HASH: ${ADMIN_BASIC_AUTH_HASH:-}
      # [WEB-GATE] The optional password in front of the website's own name
      # (WEB_HOST only; the public names stay open), the same way: a bcrypt
      # hash, its user DERIVED from the same setting, `tester` exactly when
      # the hash is set. The website itself never sees either.
      WEB_BASIC_AUTH_USER: ${WEB_BASIC_AUTH_HASH:+tester}
      WEB_BASIC_AUTH_HASH: ${WEB_BASIC_AUTH_HASH:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - swift-caddy-data:/data
      - swift-caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_started
    networks: [private]

  # [Q11] The website (apps/web), OPTIONAL. The `web` profile keeps it out of
  # every plain `up`, and pilot-up.sh turns the profile on only when deploy/.env
  # sets WEB_HOST, so a stack without WEB_HOST is exactly the API stack. The
  # site is stateless and only a CLIENT of the public API (the browser calls
  # https://API_HOST): it reads no secret and not deploy/.env, mounts nothing,
  # needs no migration and waits on no service. Caddy reaches it on the
  # private network; it publishes no port.
  web:
    profiles: ["web"]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* is inlined into the browser bundle at BUILD time, so the
      # API the site calls is fixed per image: this stack's own public API, on
      # this host's channel (apps/web/src/lib/browser-api-origin.ts refuses any
      # other pairing, so the build fails unless API_HOST is that channel's
      # API). [PROD-PATH] pilot-up.sh sets the channel from PILOT_ENV; unset
      # it stays the staging channel, as before.
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST:-localhost}
        SWIFT_WEB_CHANNEL: ${SWIFT_WEB_CHANNEL:-staging}
        # Empty keeps apps/web/src/site.config.ts refusing to build while a
        # company detail is still a {{TOKEN}}; WEB_ALLOW_SITE_TOKENS=1 in
        # deploy/.env lets the staging site build with them (PILOT-RUNBOOK.md).
        NEXT_PUBLIC_ALLOW_SITE_TOKENS: ${WEB_ALLOW_SITE_TOKENS:-}
        # [WEB-TILES] The MapTiler browser key for the site's maps: WEB_MAPTILER_KEY
        # in deploy/.env (the owner enters it at a hidden prompt). Public by design
        # and restricted in MapTiler to the site's origins. Empty: the built site
        # draws no map tiles (apps/web/src/lib/map-tiles.ts), never OpenStreetMap's.
        NEXT_PUBLIC_MAPTILER_KEY: ${WEB_MAPTILER_KEY:-}
    image: swift-web:${SWIFT_TAG:-local}
    restart: unless-stopped
    environment:
      # [Item 7 · S1] The pre-launch switch for the PUBLIC site (swiftgy.com and
      # www), read by the site while it runs (apps/web/src/lib/launch-switch.ts),
      # never baked into the image: WEB_ORDERING=live in deploy/.env opens
      # ordering there; empty (the default) shows the "Launching soon" front
      # door. Changing it recreates this container with the new setting; no
      # rebuild. Every other host this image answers, staging included, keeps
      # the full marketplace.
      SWIFT_WEB_ORDERING: ${WEB_ORDERING:-}
      # [APP-LINKS] Android App Links verification reads
      # /.well-known/assetlinks.json (apps/web/src/app/well-known/assetlinks.json/route.ts),
      # built from this variable when the site starts. The web service has no
      # env_file, so a value in deploy/.env reaches the site ONLY through this
      # line; empty keeps the honest 404. Public certificate fingerprints, not
      # a secret. Changing it recreates this container; no rebuild.
      ANDROID_CERT_SHA256: ${ANDROID_CERT_SHA256:-}
      # V8 collects well below the container's ceiling, so a leak restarts the
      # site instead of pressing on the database's memory.
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 640m
    # No host port: Caddy is the only public entrance.
    networks: [private]

  # [ADMIN-CONSOLE] The admin console (apps/admin), OPTIONAL, where partner
  # documents are approved and rejected. The `admin` profile keeps it out of
  # every plain `up`, and pilot-up.sh turns the profile on only when
  # deploy/.env sets ADMIN_HOST, so a stack without ADMIN_HOST is exactly the
  # stack above. Like the website it is stateless and only a CLIENT of the
  # public API (the browser signs in to https://API_HOST with a staff phone
  # and a one-time code; the API admits ADMIN and SUPER_ADMIN only): it reads
  # no secret and not deploy/.env, mounts nothing, needs no migration and
  # waits on no service. Caddy reaches it on the private network, behind the
  # optional second gate; it publishes no port.
  admin:
    profiles: ["admin"]
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
      # NEXT_PUBLIC_* is inlined into the browser bundle at BUILD time, so the
      # API the console calls is fixed per image: this stack's own public API.
      # The build refuses an origin that is not https.
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST:-localhost}
    image: swift-admin:${SWIFT_TAG:-local}
    restart: unless-stopped
    environment:
      # V8 collects well below the container's ceiling, so a leak restarts the
      # console instead of pressing on the database's memory.
      NODE_OPTIONS: --max-old-space-size=384
    mem_limit: 640m
    # No host port: Caddy is the only public entrance.
    networks: [private]

volumes:
  swift-pgdata:
  swift-redisdata:
  swift-meilidata:
  swift-clamdb:
  swift-caddy-data:
  swift-caddy-config:

networks:
  private:
    name: swift-pilot-private
    external: true
