# [SUP-001 · Codex REPORT-075] IMAGES ARE PINNED BY DIGEST, NOT BY TAG.
#
# A tag is a pointer its publisher can move. `docker compose pull` against a
# mutable tag can hand a production host different software than the one that
# was tested, with no diff and no signal. A digest is a content address: it
# resolves to exactly those bytes or it fails.
#
# The tag is kept beside the digest so a human can still read which version this
# is. To update one deliberately:
#
#     docker buildx imagetools inspect <repo>:<newtag>     # prints the digest
#     # then edit BOTH the tag and the digest here, in one commit, with a reason
#
# `container-image-pinning.test.ts` fails the build if a service is added
# without a digest, or pinned to `latest`.
#
# PLATFORM: THIS STACK REQUIRES AN amd64 (x86_64) HOST. Two of these images
# publish a SINGLE amd64 manifest, not a multi-platform index:
#
#     postgis/postgis:16-3.4       linux/amd64 only
#     osrm/osrm-backend:v5.25.0    linux/amd64 only   (routing compose)
#
# Every other image here is amd64+arm64. So an ARM host — Ampere, Graviton, a
# Hetzner CAX box, an Apple-silicon laptop — cannot run Postgres or OSRM
# natively; it will refuse the pull or fall back to qemu emulation, which for
# PostGIS means a database several times slower than the hardware it is on.
# This is a property of the upstream images, not of pinning: the bare tags
# resolved to the same single manifests. Verify before changing a host:
#
#     docker buildx imagetools inspect <repo>:<tag> | grep Platform
#
# (no Platform lines at all = a single-platform image; check its config with
#  `docker image inspect <ref> --format '{{.Os}}/{{.Architecture}}'`)

# ===========================================================================
# Swift — self-host / STAGING stack. One command stands up the whole platform:
#     cd deploy && cp .env.deploy.example .env && docker compose up -d
#
# This is the SAFE hosting path: a single-host deployment for staging, demos,
# and pre-launch validation. It is NOT the production cutover — that path is
# intentionally gated (see deploy/README.md "Production" and the
# MOVER-AUTHORITY-CUTOVER-RUNBOOK). Everything here is data-safe to run.
#
# Services: postgres (PostGIS), redis, meilisearch, the API, and a dedicated
# BullMQ worker (so N API replicas never process a job N times).
# ===========================================================================
name: swift

services:
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-swift}
    volumes:
      - swift-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swift} -d ${POSTGRES_DB:-swift}"]
      interval: 5s
      timeout: 5s
      retries: 12
    # No published port by default — the API reaches it on the private network.
    # Uncomment to inspect from the host: ports: ["5432:5432"]

  # [LIC-001 · Codex REPORT-075] VALKEY, NOT REDIS — and the volume is new on purpose.
  #
  # Redis 7.4 is not open source. It is offered under RSALv2 or SSPLv1; neither
  # is OSI-approved, and SSPL's service-source obligations are exactly the kind
  # a delivery platform should not discover late. Valkey is the Linux
  # Foundation fork of Redis 7.2, BSD-3-Clause, and is a drop-in for every
  # command this platform issues (measured: 58 distinct verbs, 13,187 calls,
  # the whole API suite green against it).
  #
  # THE VOLUME IS `swift-valkeydata`, NOT `swift-redisdata`. Valkey 8 CANNOT
  # READ REDIS 7.4 DATA — proven, not assumed:
  #
  #     # Can't handle RDB format version 12
  #     # Error reading the RDB base file appendonly.aof.2.base.rdb, AOF loading aborted
  #
  # and the container exits 1. `MIGRATE`/`DUMP`+`RESTORE` fail the same way
  # ("DUMP payload version or checksum are wrong"), so there is no binary
  # migration path at all. Pointing Valkey at the old volume would crash-loop
  # it, fail the API's startup PING, and take the whole platform down.
  #
  # Keeping the old volume under its own name is therefore not tidiness: it is
  # the rollback. Put the previous service back and the data is exactly where
  # it was.
  #
  # DO NOT CUT OVER WITHOUT THE PREFLIGHT. Delayed BullMQ jobs are lost with
  # the old instance, and `auto-cancel` — which can be scheduled up to
  # ORDER_HOLD_MINUTES + the vendor response SLA ahead (default 15 min,
  # configurable to 24 h) — leaves an order stuck forever if it never fires.
  # `deploy/valkey-preflight.mjs` measures what is actually outstanding.
  # Procedure and rollback: deploy/VALKEY-MIGRATION.md
  valkey:
    image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - swift-valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.9@sha256:2e540df681bfab567d449c8d7a2c5e513eb10a7aa87b13cc88da84a963a2490e
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_KEY:?set MEILISEARCH_KEY in .env}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - swift-meilidata:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: apply migrations before the API/worker boot. Compose waits on its
  # completion via service_completed_successfully.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: swift-api:${SWIFT_TAG:-local}
    # Invoke the Prisma binary directly — NOT `pnpm exec` (which re-triggers
    # corepack and pulls a newer pnpm needing Node 22). The runtime image
    # already carries the CLI and the generated engine.
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-swift}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swift}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: swift-api:${SWIFT_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      # Staging with the bundled mock providers runs in development mode — the
      # app's production guard (correctly) REFUSES mock KYC/MMG/card rails when
      # NODE_ENV=production (SPS-F-0011). Flip to production ONLY once every
      # provider in .env is a real credential (that's the LB-010 boundary).
      NODE_ENV: ${NODE_ENV:?set NODE_ENV explicitly (production|development|test|loadtest) — the API refuses to guess its posture}
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-swift}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swift}
      REDIS_URL: redis://valkey:6379
      MEILISEARCH_URL: http://meilisearch:7700
      # The API process serves HTTP only; the worker service below owns jobs.
      RUN_WORKERS: "0"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  worker:
    image: swift-api:${SWIFT_TAG:-local}
    restart: unless-stopped
    env_file: .env
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: ${NODE_ENV:?set NODE_ENV explicitly (production|development|test|loadtest) — the API refuses to guess its posture}
      # [P1] The worker sizes its own Prisma pool for its declared job
      # concurrency (src/utils/db-pool.ts; override with DB_POOL_SIZE_WORKER in
      # .env). Do NOT append ?connection_limit here — a limit written into the
      # URL is treated as a deliberate operator decision and wins over the
      # sizing, which is how this process ended up with five connections for
      # nineteen concurrent jobs in the first place.
      DATABASE_URL: postgresql://${POSTGRES_USER:-swift}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swift}
      REDIS_URL: redis://valkey:6379
      MEILISEARCH_URL: http://meilisearch:7700
      RUN_WORKERS: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy

volumes:
  swift-pgdata:
  swift-valkeydata:
  # Kept declared, not deleted: this is the rollback target. Valkey cannot
  # read it (RDB v12), so it stays exactly as Redis left it until the
  # cutover is proven and someone deliberately removes it.
  swift-redisdata:
  swift-meilidata:
