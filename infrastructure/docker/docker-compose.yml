version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: swift-postgres
    environment:
      POSTGRES_USER: swift
      POSTGRES_PASSWORD: swift
      POSTGRES_DB: swift
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: swift-redis
    ports:
      - '6382:6379'
    volumes:
      - redisdata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: swift-search
    environment:
      MEILI_NO_ANALYTICS: true
    ports:
      - '7700:7700'
    volumes:
      - searchdata:/meili_data

volumes:
  pgdata:
  redisdata:
  searchdata:
