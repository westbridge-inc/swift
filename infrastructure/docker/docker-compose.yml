# [SUP-001 · Codex REPORT-075] IMAGES ARE PINNED BY DIGEST, NOT BY TAG.
#
# A tag is a pointer its publisher can move. `docker compose pull` against a
# mutable tag can hand a production host different software than the one that
# was tested, with no diff and no signal. A digest is a content address: it
# resolves to exactly those bytes or it fails.
#
# The tag is kept beside the digest so a human can still read which version this
# is. To update one deliberately:
#
#     docker buildx imagetools inspect <repo>:<newtag>     # prints the digest
#     # then edit BOTH the tag and the digest here, in one commit, with a reason
#
# `container-image-pinning.test.ts` fails the build if a service is added
# without a digest, or pinned to `latest`.
#
# PLATFORM: THIS STACK REQUIRES AN amd64 (x86_64) HOST. Two of these images
# publish a SINGLE amd64 manifest, not a multi-platform index:
#
#     postgis/postgis:16-3.4       linux/amd64 only
#     osrm/osrm-backend:v5.25.0    linux/amd64 only   (routing compose)
#
# Every other image here is amd64+arm64. So an ARM host — Ampere, Graviton, a
# Hetzner CAX box, an Apple-silicon laptop — cannot run Postgres or OSRM
# natively; it will refuse the pull or fall back to qemu emulation, which for
# PostGIS means a database several times slower than the hardware it is on.
# This is a property of the upstream images, not of pinning: the bare tags
# resolved to the same single manifests. Verify before changing a host:
#
#     docker buildx imagetools inspect <repo>:<tag> | grep Platform
#
# (no Platform lines at all = a single-platform image; check its config with
#  `docker image inspect <ref> --format '{{.Os}}/{{.Architecture}}'`)

version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4@sha256:44126d872ac91993766c341e369c539e8196614321765d36a6f1bab0419a5fa5
    container_name: swift-postgres
    environment:
      POSTGRES_USER: swift
      POSTGRES_PASSWORD: swift
      POSTGRES_DB: swift
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  # [LIC-001 · Codex REPORT-075] Valkey, matching deploy/docker-compose.yml.
  # Development runs what production runs; a cache that differs between them is
  # where "it worked locally" comes from.
  valkey:
    image: valkey/valkey:8-alpine@sha256:d2e18f3410b6f616de1417f570fa55261af2898b9c5b2cfb6781ce2373ea43d1
    container_name: swift-valkey
    # Append-only persistence: dispatch offer state + delayed BullMQ jobs live
    # here, so a restart without AOF silently strands in-flight orders. fsync
    # every second bounds worst-case loss to ~1s of writes.
    command: ['valkey-server', '--appendonly', 'yes', '--appendfsync', 'everysec']
    ports:
      - '6382:6379'
    volumes:
      # A NEW volume. Valkey 8 cannot read a Redis 7.4 AOF/RDB (format v12) and
      # exits rather than starting, so reusing `redisdata` would leave the local
      # stack dead with a confusing message. `redisdata` stays declared below;
      # whatever is in it is still there if you need to go back.
      - valkeydata:/data

  meilisearch:
    image: getmeili/meilisearch:v1.11@sha256:6f8f1fc29d1ff67b4d8d503bb4e0a69b55c8d42600decafde951344218193a27
    container_name: swift-search
    environment:
      MEILI_NO_ANALYTICS: true
    ports:
      - '7700:7700'
    volumes:
      - searchdata:/meili_data

volumes:
  pgdata:
  valkeydata:
  # The pre-Valkey cache volume. Kept so a developer can roll back by
  # putting the old service definition back; nothing reads it now.
  redisdata:
  searchdata:
